[project]
name = "unsb"
version = "0.1.0"
description = "Unpaired Neural Schrödinger Bridge with style-vector one-to-many translation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "clean-fid==0.1.35", # pinned to the version used by one_to_many_gan for comparable scores
    "scipy<1.17",        # clean-fid uses sqrtm(disp=...), removed in scipy 1.17+
    "numpy>=2.2.3",
    "pillow>=9.1",
    "tqdm",
    "impression-tools",
]

# Pick the build of torch that matches the card. CUDA is the default choice:
#     uv sync --extra cuda
#     uv sync --extra rocm
[project.optional-dependencies]
cuda = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]
rocm = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "pytorch-triton-rocm>=3.5.1 ; sys_platform == 'linux'",
    "triton-rocm>=3.6.0 ; sys_platform == 'linux'",
]

[tool.uv]
# flat script-style repo (train.py/test.py at the root); nothing to build or install
package = false
conflicts = [[{ extra = "cuda" }, { extra = "rocm" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cuda", extra = "cuda" },
  { index = "pytorch-rocm", extra = "rocm" },
]
torchvision = [
  { index = "pytorch-cuda", extra = "cuda" },
  { index = "pytorch-rocm", extra = "rocm" },
]
pytorch-triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]
triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]
# Fetched and pinned in the lock rather than read from a sibling checkout, so
# the repo builds anywhere. To edit it alongside this project, install it over
# the top for the session: uv pip install -e ../../impression_tools
impression-tools = { git = "https://github.com/struan-robertson/impression-tools.git", rev = "b9c13a8042477e4feab51a027a728a858ce3bc0b" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
